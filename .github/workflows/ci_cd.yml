name: CI/CD Pipeline MLOps

# Déclencheurs : À chaque push ou Pull Request sur la branche main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- JOB 1: CI (Continuous Integration) ---
  # Objectif : Valider la qualité du code et des tests
  ci:
    runs-on: ubuntu-latest  # Utilisation d'un serveur Linux propre
    
    steps:
      # 1. Récupérer le code du repository
      - name: Get Python Code
        uses: actions/checkout@v3
      
      # 2. Installer Python (version 3.11 stable pour la compatibilité)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # 3. Installer les dépendances (C'est ici que requirements.txt est crucial !)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. Lancer les tests unitaires
      - name: Run Tests (Pytest)
        run: |
          pytest tests/ -v

  # --- JOB 2: CD (Continuous Deployment/Delivery) ---
  # Objectif : Produire et livrer le modèle si la CI est verte
  cd:
    needs: ci  # Ce job ne se lance QUE si le job 'ci' a réussi
    runs-on: ubuntu-latest
    
    steps:
      # 1. Récupérer le code
      - name: Get Python Code
        uses: actions/checkout@v3
      
      # 2. Installer Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # 3. Installer les dépendances (nécessaire pour entraîner)
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      # 4. Lancer l'entraînement (Production du modèle)
      - name: Train Model
        run: python src/models/train.py
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      # 5. Sauvegarder le modèle en tant qu'Artifact (Livraison)
      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployed-model  # Nom du fichier téléchargeable
          path: models/model.skops # Chemin du fichier généré
          retention-days: 5      # Garder le fichier 5 jours sur GitHub